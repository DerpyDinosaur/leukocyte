[package]
name = "leuko"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
thiserror = "=2.0.18"
anyhow = "=1.0.103"
reqwest = { version = "=0.13.4", features = ["json", "blocking", "query"] }
tokio = { version = "=1.53.1", features = [
    "rt-multi-thread",
    "time",
    "macros",
] }
serde_json = "=1.0.150"
serde = { version = "=1.0.228", features = ["derive"] }
futures = "=0.3.34"
owo-colors = { version = "=4.4.0", features = ["supports-colors"] }
indicatif = "=0.18.6"
jiff = "=0.2.39"

[lib]
doctest = false

[lints.rust]
unused = "allow"
dead_code = "allow"

[alias]
vtest = "test -q --lib audit_report_colours -- --nocapture"

# [target.x86_64-pc-windows-gnu]
# linker = "x86_64-w64-mingw32-gcc"
