[package]
name = "leuko"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1.0"
reqwest = { version = "0.13.4", features = ["json", "blocking", "query"] }
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.150"
serde = { version = "1", features = ["derive"] }
regex = "1.12.3"
futures = "0.3.34"
semver = "1.0.28"
owo-colors = { version = "4", features = ["supports-colors"] }
indicatif = "0.18.6"
console = "0.16.6"

# [target.x86_64-pc-windows-gnu]
# linker = "x86_64-w64-mingw32-gcc"

[lints.rust]
# unused = "allow"
# dead_code = "allow"
